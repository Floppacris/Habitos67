<style>

<script>

const FD="Pechuga de pollo|165|31|0|3.6;Muslo de pollo|190|27|0|8.5;Ternera magra|170|26|0|7;Lomo de cerdo|143|27|0|3.5;Pechuga de pavo|135|30|0|1;Atún al natural|116|26|0|1;Salmón|208|20|0|13;Merluza|90|18|0|1.5;Huevo|143|13|1|10;Clara de huevo|52|11|.7|.2;Leche entera|61|3.2|4.8|3.3;Yogur griego natural|97|9|4|5;Yogur natural|61|3.5|4.7|3.3;Queso fresco batido 0%|46|8|4|.2;Queso curado|402|25|1.3|33;Requesón|98|11|3.4|4.3;Proteína whey (polvo)|400|80|8|6;Arroz blanco cocido|130|2.7|28|.3;Pasta cocida|158|5.8|31|.9;Pan integral|247|13|41|3.4;Avena|389|17|66|7;Patata cocida|87|1.9|20|.1;Boniato|90|2|21|.2;Lentejas cocidas|116|9|20|.4;Garbanzos cocidos|164|9|27|2.6;Alubias cocidas|127|8.7|23|.5;Tofu|76|8|1.9|4.8;Plátano|89|1.1|23|.3;Manzana|52|.3|14|.2;Naranja|47|.9|12|.1;Fresas|32|.7|7.7|.3;Aguacate|160|2|9|15;Brócoli|34|2.8|7|.4;Ensalada mixta|20|1.5|3.5|.2;Tomate|18|.9|3.9|.2;Zanahoria|41|.9|10|.2;Aceite de oliva|884|0|0|100;Almendras|579|21|22|50;Nueces|654|15|14|65;Crema de cacahuete|588|25|20|50;Chocolate negro 70%|598|7.8|46|43;Miel|304|.3|82|0;Tortilla de trigo|310|8|52|8;Pizza|266|11|33|10;Galletas María|440|7|75|12;Refresco de cola|42|0|10.6|0";
const FOODS=FD.split(';').map(s=>{const a=s.split('|');return{n:a[0],k:+a[1],p:+a[2],c:+a[3],f:+a[4]}});
const ACT=[['Andar',3.5],['Andar rápido',4.3],['Correr suave (8 km/h)',8.3],['Correr (10 km/h)',10],['Bici suave',4],['Bici moderada',6.8],['Bici intensa',8],['Pesas / gimnasio',5],['Calistenia',5.5],['Natación',6],['Fútbol',7],['Saltar la cuerda',11],['HIIT',8],['Boxeo / saco',7.8],['Yoga',2.5]];
const MEALS=['Desayuno','Almuerzo','Cena','Snacks'],TABS=[['hoy','🏠','Hoy'],['comida','🍽️','Comida'],['ejer','🏃','Ejercicio'],['prog','📈','Progreso'],['cal','📅','Calendario'],['ajustes','⚙️','Ajustes']];
let S={habits:def,days:{},removed:[],set:{},food:{},ex:{},water:{},sleep:{},wt:{},fin:{},prod:[],fav:[]},tab='hoy',cmo=0,edit=false,medit=false,ai=null,aib='',nb=null,np=null,msg='',SM=null,cs=null,gmode='code',ftab='db',RF=[],RM=[],fm=0,fsel=null,fq='',fg=100;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.set=Object.assign({sex:'m',age:25,h:175,w:70,act:1.375,goal:300,tk:0,prot:1.8,water:2500,sleep:8,add:1,done:0},S.set);
const save=()=>{try{S.ui={tab,fm,D,t:T};localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),L=(o,k)=>o[k]||(o[k]=[]);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const key=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const color=s=>s>=70?'var(--ok)':s>=40?'var(--ac)':'var(--bad)';
let T=key(),D=T;if(S.ui){tab=S.ui.tab||tab;fm=S.ui.fm||0;if(S.ui.t===T&&S.ui.D)D=S.ui.D}
const calc=c=>{let mx=0,g=0;S.habits.forEach(h=>{if(h.w>0)mx+=h.w;if(c[h.id])g+=h.w});return mx?Math.max(0,Math.min(100,rn(g/mx*100))):0};
function tgt(){const s=S.set,b=10*s.w+6.25*s.h-5*s.age+(s.sex==='m'?5:-161),t=b*s.act;return{tdee:rn(t),k:s.tk>0?rn(s.tk):rn(t+s.goal)}}
function macros(k){const p=S.set.prot*S.set.w,f=.25*k/9;return{p,f,c:Math.max(0,(k-4*p-9*f)/4)}}
function tot(d){const o={k:0,p:0,c:0,f:0,e:0};(S.food[d]||[]).forEach(x=>{o.k+=x.k;o.p+=x.p;o.c+=x.c;o.f+=x.f});(S.ex[d]||[]).forEach(x=>o.e+=x.k);return o}
const bar=(v,m,c)=>`<div class="bar"><i style="width:${Math.min(100,m>0?v/m*100:0)}%;background:${c}"></i></div>`;
const mac=(l,v,m,c)=>`<div class="rb sm"><span>${l}</span><span>${rn(v)} / ${rn(m)} g</span></div>${bar(v,m,c)}<div style="height:8px"></div>`;
const hrows=l=>l.map(h=>{const on=!!((S.days[D]||{c:{}}).c[h.id]);return `<div class="row ${h.w<0?'bad ':''}${on?'on':''}" data-t="${h.id}"><span class="box">${on?'✓':''}</span><span class="n">${esc(h.n)}</span><span class="w">${h.w>0?'+':'−'}${Math.abs(h.w)}</span>${edit?`<button class="x" data-d="${h.id}">×</button>`:''}</div>`}).join('')||'<p class="sm">Sin hábitos</p>';
const addForm=`<div style="display:grid;gap:8px;margin-top:12px"><input id="hn" placeholder="Nuevo hábito" maxlength="40"><div class="gr"><select id="ht"><option value="1">Bueno (suma)</option><option value="-1">Malo (resta)</option></select><select id="hw"><option value="1">Peso 1</option><option value="2" selected>Peso 2</option><option value="3">Peso 3</option></select></div><button class="b" data-a="addh">Añadir</button></div>`;

const ICO=[[/pollo|pavo/,'🍗'],[/ternera|cerdo/,'🥩'],[/atun|salmon|merluza/,'🐟'],[/huevo|clara/,'🥚'],[/leche|yogur|queso|requeson/,'🥛'],[/arroz/,'🍚'],[/pasta/,'🍝'],[/\bpan\b|tortilla|avena/,'🍞'],[/patata|boniato/,'🥔'],[/lenteja|garbanzo|alubia|tofu/,'🫘'],[/platano/,'🍌'],[/manzana/,'🍎'],[/naranja/,'🍊'],[/fresa/,'🍓'],[/aguacate/,'🥑'],[/brocoli|ensalada|tomate|zanahoria/,'🥦'],[/aceite/,'🫒'],[/almendra|nuez|nueces|cacahuete/,'🥜'],[/chocolate|galleta|miel/,'🍫'],[/pizza/,'🍕'],[/refresco/,'🥤'],[/proteina|whey/,'💪']];
const ic=n=>{n=norm(n);for(const a of ICO)if(a[0].test(n))return a[1];return '🍽️'};
const streak=()=>{let n=0,d=new Date(T+'T12:00:00');if(!S.fin[key(d)])d.setDate(d.getDate()-1);while(S.fin[key(d)]){n++;d.setDate(d.getDate()-1)}return n};
function wk(){const d=new Date(D+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);let h='';for(let i=0;i<7;i++){const k=key(d),has=(S.days[k]&&Object.keys(S.days[k].c).length)||(S.food[k]||[]).length||(S.ex[k]||[]).length;h+=`<button class='wd${k===D?' on':''}' data-a='sd' data-v='${k}'><i>${'LMXJVSD'[i]}</i><b>${d.getDate()}</b><u class='${has?'y':''}'></u></button>`;d.setDate(d.getDate()+1)}return `<div class='wk'>${h}</div>`}
function hdr(){const dd=new Date(D+'T12:00:00'),df=rn((dd-new Date(T+'T12:00:00'))/864e5),l=df===0?'Hoy':df===-1?'Ayer':df===1?'Mañana':dd.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'});return `<div class='top'><button class='ttl' data-a='tab' data-v='cal'>${l} <span>⌄</span></button><div class='rb' style='gap:14px'><span class='fire'>🔥 ${streak()}</span><button class='av' data-a='tab' data-v='ajustes'>C</button></div></div>${wk()}`}
function gauge(v,g){const R=600,cx=150,cy=633.4,al=Math.asin(140/R),pt=(f,r)=>{const a=-al+2*al*f;return[cx+r*Math.sin(a),cy-r*Math.cos(a)]},mx=2*g,P='M10 50A600 600 0 0 1 290 50',p=Math.min(100,v/mx*100);
let h=`<svg viewBox='0 0 300 80' width='100%'><path d='${P}' pathLength='100' fill='none' stroke='#2a2a2d' stroke-width='9' stroke-linecap='round'/>`;
if(p>0)h+=`<path d='${P}' pathLength='100' fill='none' stroke='${v>g*1.1?'#f87171':'#fbbf24'}' stroke-width='9' stroke-linecap='round' stroke-dasharray='${p} 100'/>`;
[.9,1.1].forEach(x=>{const f=x*g/mx,a=pt(f,588),b=pt(f,612),q=pt(f,600);h+=`<line x1='${a[0]}' y1='${a[1]}' x2='${b[0]}' y2='${b[1]}' stroke='#555' stroke-width='6' stroke-linecap='round'/><text x='${q[0]}' y='72' text-anchor='middle' fill='#8a8a96' font-size='12'>${rn(x*g).toLocaleString('en')}</text>`});
return h+'</svg>'}

async function foodPhoto(f){if(!SM)return;ai=null;msg='';aib='Analizando la foto… puede tardar unos segundos';render();
  try{const r=await SM.json(PF,{images:[await shrink(f)],modelTier:'default',cache:false});
    ai={items:(r.items||[]).map(x=>({n:String(x.n||'Alimento'),g:+x.g||0,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0})).filter(x=>x.k>0),nota:String(r.nota||'')};
    if(!ai.items.length){ai=null;msg='No reconocí comida en la foto.'}}catch(e){msg=em(e)}
  aib='';render()}
async function codePhoto(f){aib='Leyendo el código…';render();const c=await decodeFile(f);aib='';code(c)}
async function labelPhoto(f){if(!SM)return;if(nb===null)nb='';aib='Leyendo la etiqueta…';render();
  try{const r=await SM.json(PL,{images:[await shrink(f)],modelTier:'default',cache:false});np={n:String(r.n||''),k:+r.k||0,p:+r.p||0,c:+r.c||0,f:+r.f||0};msg='Revisa los valores antes de guardar.'}catch(e){msg=em(e)}
  aib='';render()}
function tools(){const inp=(id,ph,v)=>`<input id='${id}' type='number' inputmode='decimal' placeholder='${ph}' value='${v?v:''}'>`;
return `<button class='b' style='width:100%;margin-top:10px' data-a='cam'>📷 Cámara · escanear o foto</button><button class='lk' data-a='nbo'>Escribir código a mano</button>`
+(aib?`<p class='sm'>⏳ ${esc(aib)}</p>`:'')+(msg?`<p class='sm' style='color:var(--ac)'>${esc(msg)}</p>`:'')
+(ai&&ai.items.length?`<div class='sel'><b>Estimación de la foto</b>${ai.items.map((x,i)=>`<div class='r'><span style='flex:1'>${esc(x.n)}<div class='sm'>${rn(x.g)} g · P ${rn(x.p)} · C ${rn(x.c)} · G ${rn(x.f)}</div></span><b>${rn(x.k)}</b><button class='x' data-a='aix' data-v='${i}'>×</button></div>`).join('')}<div class='sm' style='margin:6px 0'>${esc(ai.nota)} Es una estimación: revísala.</div><button class='b' style='width:100%' data-a='aia'>Añadir todo a ${MEALS[fm]}</button></div>`:'')
+(nb!==null?`<div class='sel'><b>Producto nuevo</b> <span class='sm'>(valores por 100 g)</span><div class='gr' style='margin-top:8px'><input id='qb' inputmode='numeric' placeholder='Código de barras' value='${esc(nb)}'><button class='g' data-a='nbs'>Buscar código</button></div><button class='g' style='width:100%;margin-top:8px' data-a='pcb'>📷 Foto del código</button><input id='qn' placeholder='Nombre' value='${esc(np?np.n:'')}' style='margin-top:8px'><div class='gr' style='margin-top:8px'>${inp('qk','kcal',np&&np.k)}${inp('qp','Proteína g',np&&np.p)}${inp('qc','Carbos g',np&&np.c)}${inp('qf','Grasas g',np&&np.f)}</div>${SM?`<button class='g' style='width:100%;margin-top:8px' data-a='lbl'>📷 Leer etiqueta con foto</button>`:''}<div class='gr' style='margin-top:8px'><button class='b' data-a='nbv'>Guardar y usar</button><button class='g' data-a='nbx'>Cancelar</button></div></div>`:'')}
document.addEventListener('change',async e=>{const t=e.target,f=t.files&&t.files[0];if(!f||t.type!=='file')return;t.value='';closeCam();const m=t.id==='pg'?gmode:({pf:'food',pc:'code',pl:'label'})[t.id];if(m==='food')await foodPhoto(f);else if(m==='label')await labelPhoto(f);else await codePhoto(f)});
if(window.claude&&claude.use)claude.use('sample').then(s=>{if(s){SM=s;render()}}).catch(()=>{});
function render(){const d=new Date(D+'T12:00:00');
const hd=`<div class="rb" style="margin-bottom:12px"><button class="g" data-a="day" data-v="-1">‹</button><b style="text-transform:capitalize">${D===T?'Hoy · ':''}${d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'short'})}</b><button class="g" data-a="day" data-v="1">›</button></div>`;
$('#v').innerHTML=(['hoy','comida','ejer'].includes(tab)?hdr():'')+({hoy:vHoy,comida:vComida,ejer:vEjer,prog:vProg,cal:vCal,ajustes:vAjus}[tab])();
$('#nv').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-a="tab" data-v="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('');pv();ev()}
const go=()=>{save();render()};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-t],[data-d]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,n=id=>$(id).value.trim(),x=id=>+$(id).value||0;msg='';
if(b.dataset.d){S.removed.push(b.dataset.d);S.habits=S.habits.filter(h=>h.id!==b.dataset.d);Object.values(S.days).forEach(d=>d.s=calc(d.c))}
else if(b.dataset.t){const d=S.days[D]||(S.days[D]={c:{},s:0}),id=b.dataset.t;if(d.c[id])delete d.c[id];else d.c[id]=1;d.s=calc(d.c)}
else if(a==='tab'){tab=v;scrollTo(0,0)}
else if(a==='day'){const d=new Date(D+'T12:00:00');d.setDate(d.getDate()+ +v);const k=key(d);D=k>T?T:k}
else if(a==='ft')ftab=v;else if(a==='fv'){const f=ALL()[fsel];if(f){const i=S.fav.indexOf(f.n);if(i>=0)S.fav.splice(i,1);else S.fav.push(f.n)}}else if(a==='rq'){const x=RF[+v];if(x){L(S.food,D).push(Object.assign({},x,{m:fm}));msg='Añadido a '+MEALS[fm]}}else if(a==='rmc'){const g=RM[+v];if(g){g.e.forEach(x=>L(S.food,D).push(Object.assign({},x,{m:fm})));msg='Comida añadida a '+MEALS[fm]}}else if(a==='cam'){openCam('code');return}else if(a==='pf'){$('#pf').click();return}else if(a==='pcb'){openCam('code');return}else if(a==='lbl'){openCam('label');return}else if(a==='nbo'){nb='';np=null}else if(a==='aix')ai.items.splice(+v,1);else if(a==='aia'){ai.items.forEach(i=>L(S.food,D).push({m:fm,n:i.n,g:rn(i.g),k:r1(i.k),p:r1(i.p),c:r1(i.c),f:r1(i.f)}));ai=null}else if(a==='nbs'){const c=n('#qb');if(c)code(c)}else if(a==='nbv'){const t=n('#qn'),k=x('#qk');if(t&&k>0){S.prod.push({bc:n('#qb'),n:t,k,p:x('#qp'),c:x('#qc'),f:x('#qf')});fsel=FOODS.length+S.prod.length-1;fg=100;nb=null;np=null}else msg='Pon al menos el nombre y las kcal por 100 g.'}else if(a==='nbx'){nb=null;np=null}else if(a==='sd')D=v;else if(a==='fin')S.fin[D]=S.fin[D]?0:1;else if(a==='mm')medit=!medit;else if(a==='fplus'){fm=+v;tab='comida';scrollTo(0,0)}else if(a==='cd'){D=v;tab='hoy';scrollTo(0,0)}else if(a==='cm')cmo+= +v;else if(a==='ed')edit=!edit;
else if(a==='addh'){const t=n('#hn');if(t)S.habits.push({id:'x'+Date.now(),n:t,w:x('#hw')*x('#ht')})}
else if(a==='w')S.water[D]=Math.max(0,(S.water[D]||0)+ +v);
else if(a==='sl')S.sleep[D]=Math.max(0,Math.min(14,(S.sleep[D]||0)+ +v));
else if(a==='fm')fm=+v;
else if(a==='fs'){fsel=+v;fg=100}
else if(a==='fadd'){const g=x('#g'),f=ALL()[fsel];if(g>0&&f){const q=g/100;L(S.food,D).push({m:fm,n:f.n,g,k:r1(f.k*q),p:r1(f.p*q),c:r1(f.c*q),f:r1(f.f*q)});fsel=null;fq=''}}
else if(a==='fcus'){const t=n('#cn');if(t&&n('#ck')!=='')L(S.food,D).push({m:fm,n:t,g:0,k:x('#ck'),p:x('#cp'),c:x('#cc'),f:x('#cf')})}
else if(a==='fdel')S.food[D].splice(+v,1);
else if(a==='eadd'){const ac=ACT[+$('#ea').value],mn=x('#em');if(mn>0)L(S.ex,D).push({n:ac[0],min:mn,k:r1(ac[1]*S.set.w*mn/60)})}
else if(a==='ecus'){const t=n('#en');if(t&&x('#ek')>0)L(S.ex,D).push({n:t,min:0,k:x('#ek')})}
else if(a==='edel')S.ex[D].splice(+v,1);
else if(a==='wsave'){const w=x('#wi');if(w>20&&w<400){S.wt[D]=w;S.set.w=S.wt[Object.keys(S.wt).sort().pop()]}}
else if(a==='exp'){$('#bk').value=JSON.stringify(S);return}
else if(a==='imp'){try{const o=JSON.parse($('#bk').value);if(o&&o.habits&&o.days){S=Object.assign(S,o);S.set=Object.assign({},S.set,o.set)}}catch(er){}}
go()});
document.addEventListener('input',e=>{const i=e.target.id;if(i==='q'){fq=e.target.value;$('#res').innerHTML=resBox()}else if(i==='g'){fg=+e.target.value||0;pv()}else if(i==='em')ev()});
document.addEventListener('change',e=>{const f=e.target.dataset.s;if(f){const v=e.target.type==='checkbox'?+e.target.checked:e.target.value;S.set[f]=f==='sex'?v:(+v||0);S.set.done=1;if(f==='w'&&S.set.w>0)S.wt[D]=S.set.w;go()}else if(e.target.id==='ea')ev()});

S.removed=S.removed||[];
def.forEach(h=>{if(!S.habits.some(x=>x.id===h.id)&&!S.removed.includes(h.id))S.habits.push(Object.assign({},h))});
if(S.days[T])S.days[T].s=calc(S.days[T].c);
save();
const roll=()=>{const k=key();if(k!==T){if(D===T)D=k;T=k;render()}};
setInterval(roll,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)roll()});
render();
